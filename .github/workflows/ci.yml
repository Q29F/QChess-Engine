name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-installer.txt
      - name: Install Python dependencies
        run: |
          python -m venv --without-pip .venv
          python -m pip --python .venv install --require-hashes --only-binary=:all: -r requirements-installer.txt
          .venv/bin/python -m pip install --require-hashes --no-build-isolation -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m compileall -q src tests workbench.py web.py localServer.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=low
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt -r requirements-installer.txt --disable-pip --no-deps
